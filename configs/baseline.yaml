# Baseline Model Configuration
# Simple: Seq Encoder → MLP Non-Seq Encoder → Concat → CVR Head (no Unified Block)

data:
  parquet_path: data/raw/demo_1000.parquet
  max_seq_len: 100
  max_array_len: 20
  val_ratio: 0.1
  batch_size: 1024
  num_workers: 4

model:
  hidden_dim: 128
  num_unified_blocks: 0          # 0 = no unified block, direct concat baseline
  seq_encoder_type: transformer  # transformer | gru | identity
  seq_num_heads: 4
  seq_num_layers: 2
  nonseq_encoder_type: mlp       # mlp | dcnv2 | fm
  pooling_type: mean             # mean | cls | target_aware
  dropout: 0.1

train:
  optimizer: adamw
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  max_epochs: 10
  warmup_steps: 500
  gradient_clip: 1.0
  mixed_precision: true
  seed: 42

eval:
  metrics: [auc_roc, log_loss]
  eval_every_n_steps: 500
  save_top_k: 3

logging:
  backend: wandb               # wandb | tensorboard | none
  project: taac2026
  run_name: baseline
